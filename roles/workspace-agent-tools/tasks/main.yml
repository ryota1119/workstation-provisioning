---
- name: claude-obsidianをclone/更新
  ansible.builtin.command:
    argv:
      - ghq
      - get
      - --update
      - -p
      - "{{ workspace_agent_tool_repo }}"
  register: workspace_agent_tool_ghq_get_result
  changed_when: >-
    'Already up to date.' not in (workspace_agent_tool_ghq_get_result.stdout ~ workspace_agent_tool_ghq_get_result.stderr)
    and 'Already up-to-date.' not in (workspace_agent_tool_ghq_get_result.stdout ~ workspace_agent_tool_ghq_get_result.stderr)
  tags:
    - install
    - upgrade
    - workspace-agent-tools

- name: OpenCode向けポータブルSkillをリンク
  ansible.builtin.command:
    argv:
      - bash
      - bin/setup-multi-agent.sh
      - --host
      - opencode
      - --apply
  args:
    chdir: "{{ workspace_agent_tool_checkout }}"
  register: workspace_agent_tool_apply_result
  changed_when: >-
    (workspace_agent_tool_apply_result.stdout ~ workspace_agent_tool_apply_result.stderr)
    is search('CREATED')
  tags:
    - install
    - upgrade
    - workspace-agent-tools

- name: OpenCode向けポータブルSkillのリンクを検証
  ansible.builtin.command:
    argv:
      - bash
      - bin/setup-multi-agent.sh
      - --host
      - opencode
      - --check
  args:
    chdir: "{{ workspace_agent_tool_checkout }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - workspace-agent-tools
