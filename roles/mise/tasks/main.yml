---
- name: miseセットアップ
  tags:
    - provision
    - mise
  block:
    - name: miseをインストール
      ansible.builtin.package:
        name: mise
        state: present

    - name: 指定バージョンをインストール
      ansible.builtin.shell: "mise use --global {{ item.name }}@{{ item.version }}"
      loop: "{{ mise_tools_versions | default([]) }}"
      loop_control:
        label: "{{ item.name }}@{{ item.version }}"
      register: mise_install_result
      changed_when: "'Installing' in mise_install_result.stderr or 'installed' in mise_install_result.stderr"
      failed_when: false

    - name: mise shimsを更新
      ansible.builtin.shell: mise reshim
      changed_when: false
