---
- name: Tapリポジトリを追加
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_taps | default([]) }}"
  when: brew_taps is defined and brew_taps | length > 0
  loop_control:
    label: "{{ item }}"
  ignore_errors: true  # 既に追加済みの場合の既知の不具合を回避

- name: Formulaパッケージをインストール
  community.general.homebrew:
    name: "{{ brew_formula }}"
    state: present
  when: brew_formula is defined and brew_formula | length > 0
  ignore_errors: true  # 既にインストール済みの場合の既知の不具合を回避

- name: Caskアプリケーション（通常）をインストール
  community.general.homebrew_cask:
    name: "{{ brew_casks_normal }}"
    state: present
  ignore_errors: true  # 既にインストール済みの場合の既知の不具合を回避
  when: brew_casks_normal is defined and brew_casks_normal | length > 0

- name: Caskアプリケーション（sudo必要）の手動インストール案内
  ansible.builtin.debug:
    msg: |
      以下のCaskはrootパスワードが必要なため、手動インストールが必要です：
      brew install --cask {{ brew_casks_sudo_required | join(' ') }}
  when: brew_casks_sudo_required is defined and brew_casks_sudo_required | length > 0