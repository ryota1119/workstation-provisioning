---
- name: Tapリポジトリを追加
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_taps_all | default([], true) }}"
  loop_control:
    label: "{{ item }}"

- name: Tapの信頼状態を確認
  ansible.builtin.command: "{{ brew_bin }} tap-info --json {{ item }}"
  loop: "{{ brew_taps_all | default([], true) }}"
  register: tap_info_results
  changed_when: false
  loop_control:
    label: "{{ item }}"

- name: Tapリポジトリを信頼
  ansible.builtin.command: "{{ brew_bin }} trust --tap {{ item.item }}"
  loop: "{{ tap_info_results.results | default([]) }}"
  when: not ((item.stdout | from_json)[0].trusted | default(true))
  changed_when: true
  loop_control:
    label: "{{ item.item }}"

- name: Formulaパッケージをインストール
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_formula_all | default([], true) }}"
  loop_control:
    label: "{{ item }}"

- name: 案内メッセージ用のbrewサブコマンドを設定
  ansible.builtin.set_fact:
    brew_cask_action_command: install

# sudoが必要かどうかは事前に分類せず、実際に試して弾かれたものを後で拾う。
# 失敗理由を文字列で判定するため、community.general.homebrew_cask モジュールではなく
# コマンドを直接実行してstdout/stderrをそのまま受け取る。
# 冪等性はインストール済みCaskを手前で除外することで担保している。
- name: Caskアプリケーションをインストール
  ansible.builtin.command: "{{ brew_bin }} install --cask {{ item }}"
  loop: >-
    {{ brew_casks_all | default([], true)
       | reject('in', installed_casks.stdout_lines | default([], true)) | list }}
  loop_control:
    label: "{{ item }}"
  register: cask_install_results
  changed_when: cask_install_results.rc == 0
  failed_when: false

- name: Caskインストールの失敗を処理
  ansible.builtin.include_tasks: resolve-cask-failures.yml
  vars:
    cask_attempt_results: "{{ cask_install_results.results | default([]) }}"
    brew_cask_action: インストール
