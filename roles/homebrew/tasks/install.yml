---
########################################################
# Tapリポジトリの追加
########################################################
- name: Tapリポジトリを追加
  community.general.homebrew_tap:
    name: "{{ brew_taps | default([]) }}"
    state: present
  tags:
    - tap

########################################################
# Formulaパッケージのインストール
########################################################
- name: Formulaパッケージをインストール
  community.general.homebrew:
    name: "{{ brew_formula | default([]) }}"
    state: present
  tags:
    - formula

########################################################
# Caskアプリケーションのインストール
########################################################
- name: Caskアプリケーション（通常）をインストール
  community.general.homebrew_cask:
    name: "{{ brew_casks_normal | default([]) }}"
    state: present
  tags:
    - cask
########################################################
# Caskアプリケーション（sudo必要）の手動インストール指示
########################################################
- name: Caskアプリケーション（sudo必要）の手動インストール指示を表示
  ansible.builtin.debug:
    msg:
      - ""
      - "============================================================"
      - "以下のCaskアプリケーションは、rootパスワードが必要なため"
      - "自動インストールから除外されています。"
      - "手動でインストールしてください。"
      - "============================================================"
      - ""
      - "インストールコマンド:"
      - "  brew install --cask {{ brew_casks_sudo_required | join(' ') }}"
      - ""
      - "または、個別にインストール:"
      - "{% for cask in brew_casks_sudo_required | default([]) %}"
      - "  brew install --cask {{ cask }}"
      - "{% endfor %}"
      - ""
      - "============================================================"
  when: brew_casks_sudo_required is defined and brew_casks_sudo_required | length > 0
  tags:
    - cask
