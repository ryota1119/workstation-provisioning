---
- name: 更新可能なFormulaパッケージを取得
  ansible.builtin.command: "{{ brew_bin }} outdated --formula --quiet"
  register: outdated_formulas
  changed_when: false
  failed_when: false

- name: Formulaパッケージをアップグレード
  ansible.builtin.command: "{{ brew_bin }} upgrade --formula {{ item }}"
  loop: "{{ (outdated_formulas.stdout_lines | default([], true)) | select('in', brew_formula_all | default([], true)) | list }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true

- name: 更新可能なCaskパッケージを取得
  ansible.builtin.command: "{{ brew_bin }} outdated --cask --greedy --quiet"
  register: outdated_casks_all
  changed_when: false
  failed_when: false

- name: Caskパッケージのアップグレード処理
  when: (outdated_casks_all.stdout_lines | default([], true)) | length > 0
  block:
    - name: 更新対象のCaskを抽出
      ansible.builtin.set_fact:
        outdated_casks_normal: "{{ outdated_casks_all.stdout_lines | select('in', brew_casks_normal_all | default([], true)) | list }}"
        outdated_casks_sudo: "{{ outdated_casks_all.stdout_lines | select('in', brew_casks_sudo_required_all | default([], true)) | list }}"

    - name: 通常のCaskパッケージをアップグレード
      ansible.builtin.command: "{{ brew_bin }} upgrade --cask {{ item }} --greedy"
      loop: "{{ outdated_casks_normal }}"
      loop_control:
        label: "{{ item }}"
      when: outdated_casks_normal | length > 0
      changed_when: true
      register: cask_upgrade_results
      failed_when:
        - cask_upgrade_results.rc != 0
        - "'It seems there is already an App at' not in (cask_upgrade_results.stderr | default(''))"
        - "'It seems there is already an App at' not in (cask_upgrade_results.stdout | default(''))"

    - name: アップグレード失敗したCaskを強制再インストール（古いバージョンが残存している場合の対応）
      ansible.builtin.command: "{{ brew_bin }} reinstall --cask {{ item.item }}"
      loop: "{{ cask_upgrade_results.results | default([]) | selectattr('rc', 'ne', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: cask_upgrade_results.results is defined
      changed_when: true

    - name: Cask（sudo必要）の手動アップグレード案内
      ansible.builtin.debug:
        msg: |
          以下のCaskはrootパスワードが必要なため、手動アップグレードが必要です：
          brew upgrade --cask {{ outdated_casks_sudo | join(' ') }}
      when: outdated_casks_sudo | length > 0

- name: 古いバージョンのファイルを削除
  ansible.builtin.command: "{{ brew_bin }} cleanup"
  changed_when: false
