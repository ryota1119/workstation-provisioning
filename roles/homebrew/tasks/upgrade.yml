---
- name: 更新可能なFormulaパッケージを取得
  ansible.builtin.command: "{{ brew_bin }} outdated --formula --quiet"
  register: outdated_formulas
  changed_when: false
  failed_when: false

- name: Formulaパッケージをアップグレード
  ansible.builtin.command: "{{ brew_bin }} upgrade --formula {{ item }}"
  loop: "{{ (outdated_formulas.stdout_lines | default([], true)) | select('in', brew_formula_all | default([], true)) | list }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true

- name: 案内メッセージ用のbrewサブコマンドを設定
  ansible.builtin.set_fact:
    brew_cask_action_command: upgrade

- name: 更新可能なCaskパッケージを取得
  ansible.builtin.command: "{{ brew_bin }} outdated --cask --greedy --quiet"
  register: outdated_casks_all
  changed_when: false
  failed_when: false

- name: Caskパッケージのアップグレード処理
  when: (outdated_casks_all.stdout_lines | default([], true)) | length > 0
  block:
    # brew outdated の出力はトークン名のみ。インストール済みの管理対象Caskだけで
    # 対応表を作ることで、別tapの同名Caskが入っている場合に誤って引き当てない。
    - name: インストール済み管理対象Caskのトークン対応表を作成
      vars:
        managed_installed: >-
          {{ brew_casks_all | default([], true)
             | select('in', installed_casks.stdout_lines | default([], true)) | list }}
      ansible.builtin.set_fact:
        casks_by_token: "{{ dict(managed_installed | map('basename') | zip(managed_installed)) }}"

    # 照合はトークン名で行い、brew へ渡す引数には管理名（tap修飾名）を使う。
    - name: 更新対象のCaskを抽出
      ansible.builtin.set_fact:
        outdated_casks_managed: >-
          {{ outdated_casks_all.stdout_lines | select('in', casks_by_token)
             | map('extract', casks_by_token) | list }}

    # sudoが必要かどうかは事前に分類せず、全て試して弾かれたものを後で拾う。
    - name: Caskパッケージをアップグレード
      ansible.builtin.command: "{{ brew_bin }} upgrade --cask {{ item }} --greedy"
      loop: "{{ outdated_casks_managed }}"
      loop_control:
        label: "{{ item }}"
      register: cask_upgrade_results
      changed_when: cask_upgrade_results.rc == 0
      failed_when: false

    - name: Caskアップグレードの失敗を処理
      ansible.builtin.include_tasks: resolve-cask-failures.yml
      vars:
        cask_attempt_results: "{{ cask_upgrade_results.results | default([]) }}"
        brew_cask_action: アップグレード

- name: 古いバージョンのファイルを削除
  ansible.builtin.command: "{{ brew_bin }} cleanup"
  changed_when: false
