---
########################################################
# Homebrewの存在確認
########################################################
- name: Homebrewがインストールされているか確認
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: brew_stat
  tags:
    - provision
    - upgrade
    - homebrew

- name: Homebrewが見つからない場合は処理を中断
  ansible.builtin.fail:
    msg: "Homebrewがインストールされていません。`make bootstrap` を実行してください。"
  when: not brew_stat.stat.exists
  tags:
    - provision
    - upgrade
    - homebrew

- name: Homebrewのパスを変数に設定
  ansible.builtin.set_fact:
    brew_bin: /opt/homebrew/bin
  tags:
    - provision
    - upgrade
    - homebrew

########################################################
# Homebrewの更新
########################################################
- name: Homebrewを最新版に更新
  community.general.homebrew:
    update_homebrew: true
  tags:
    - provision
    - upgrade
    - homebrew

########################################################
# インストール処理
########################################################
- name: Homebrewパッケージのインストール
  ansible.builtin.import_tasks: install.yml
  tags:
    - provision
    - homebrew

########################################################
# アップグレード処理
########################################################
- name: Homebrewパッケージのアップグレード
  ansible.builtin.import_tasks: upgrade.yml
  tags:
    - upgrade
    - homebrew
