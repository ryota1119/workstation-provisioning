---
- name: dotfilesの差分を確認
  ansible.builtin.command:
    argv:
      - "{{ chezmoi_bin }}"
      - diff
      - --exit-code
  when:
    - chezmoi_repo.stat.exists
    - op_auth_status.rc == 0
  register: chezmoi_diff_result
  changed_when: false
  failed_when: chezmoi_diff_result.rc not in [0, 1]

- name: dotfilesを適用（ローカル変更を上書き）
  ansible.builtin.command:
    argv:
      - "{{ chezmoi_bin }}"
      - apply
      - --force
  when:
    - chezmoi_repo.stat.exists
    - op_auth_status.rc == 0
    - (chezmoi_diff_result.rc | default(0)) == 1
  register: chezmoi_apply_result
  changed_when: true

- name: 適用結果を表示
  ansible.builtin.debug:
    msg: "{{ chezmoi_apply_result.stdout }}"
  when:
    - chezmoi_repo.stat.exists
    - op_auth_status.rc == 0
    - chezmoi_apply_result.stdout is defined
    - chezmoi_apply_result.stdout | length > 0

- name: 1Password未認証によりchezmoi applyをスキップ
  ansible.builtin.debug:
    msg: |
      ⏭️  1Password CLIが認証されていないため、chezmoi applyをスキップしました。
      認証後、手動で実行してください：
      $ op signin
      $ chezmoi apply --force
  when:
    - chezmoi_repo.stat.exists
    - op_auth_status.rc != 0
