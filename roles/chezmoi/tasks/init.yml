---
- name: dotfilesリポジトリの存在確認
  ansible.builtin.stat:
    path: ~/.local/share/chezmoi/.git
  register: chezmoi_repo

- name: chezmoiの初期化
  ansible.builtin.shell: "chezmoi init {{ chezmoi_repo_url }}"
  when:
    - not chezmoi_repo.stat.exists
    - chezmoi_repo_url is defined
  register: chezmoi_init_result
  changed_when: chezmoi_init_result.rc == 0

- name: 初期化が必要な場合は通知
  ansible.builtin.debug:
    msg: |
      ℹ️  chezmoiリポジトリが未初期化で、かつ chezmoi_repo_url も未定義です。
      group_vars/all.yml に chezmoi_repo_url を設定してください：
        chezmoi_repo_url: "git@github.com:<username>/dotfiles.git"

      または手動で初期化:
        $ chezmoi init <repo-url>
  when:
    - not chezmoi_repo.stat.exists
    - chezmoi_repo_url is not defined