---
- name: 更新可能なMac App Storeアプリを取得
  ansible.builtin.command: "{{ mas_bin }} outdated"
  register: outdated_mas_apps
  changed_when: false
  failed_when: false

- name: アップデート対象がある場合に手動アップデート案内
  ansible.builtin.debug:
    msg: |
      以下のMac App Storeアプリにアップデートがあります：
      {{ outdated_mas_apps.stdout_lines | join('
      ') }}

      `mas install --force` はsudoが必要なため自動更新できません。
      App Storeアプリの「アップデート」タブから手動でアップデートしてください。
  when: outdated_mas_apps.stdout_lines | length > 0

- name: アップデート対象がない場合の通知
  ansible.builtin.debug:
    msg: "✅ Mac App Storeアプリは全て最新です。"
  when: outdated_mas_apps.stdout_lines | length == 0
