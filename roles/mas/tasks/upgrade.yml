---
########################################################
# Mac App Storeアプリのアップグレード
########################################################
- name: 更新可能なMac App Storeアプリを取得
  ansible.builtin.shell: |
    /opt/homebrew/bin/mas outdated
  register: outdated_mas_apps
  changed_when: false
  failed_when: false

- name: Mac App Storeアプリをアップグレード
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/mas install {{ item }}
  loop: "{{ outdated_mas_apps.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_method: sudo
  when: outdated_mas_apps.stdout_lines | length > 0
