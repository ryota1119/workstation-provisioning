---
########################################################
# MAS（Mac App Store CLI）の存在確認
########################################################
- name: MASがインストールされているか確認
  ansible.builtin.stat:
    path: /opt/homebrew/bin/mas
  register: mas_stat
  tags:
    - provision
    - install
    - upgrade
    - mas

- name: MASが見つからない場合は処理を中断
  ansible.builtin.fail:
    msg: "MASがインストールされていません。"
  when: not mas_stat.stat.exists
  tags:
    - provision
    - install
    - upgrade
    - mas

########################################################
# App Storeログイン確認
########################################################
- name: App Storeへのログイン状態を確認
  ansible.builtin.command: /opt/homebrew/bin/mas list
  register: mas_list_result
  changed_when: false
  failed_when: false
  tags:
    - provision
    - install
    - upgrade
    - mas

- name: App Store未ログインの警告
  ansible.builtin.debug:
    msg: |
      ⚠️  App Storeにログインしていない可能性があります。
      masコマンドでログインしてください：
      $ mas signin your-apple-id@example.com
      
      または、App Storeアプリから手動でログインしてください。
  when: mas_list_result.rc != 0
  tags:
    - provision
    - install
    - upgrade
    - mas

########################################################
# インストール処理
########################################################
- name: Mac App Storeアプリのインストール
  ansible.builtin.import_tasks: install.yml
  tags:
    - provision
    - install
    - mas

########################################################
# アップグレード処理
########################################################
- name: Mac App Storeアプリのアップグレード
  ansible.builtin.import_tasks: upgrade.yml
  tags:
    - upgrade
