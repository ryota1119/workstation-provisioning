---
- name: macOSシステム設定を適用
  ansible.builtin.command: "defaults write {{ item.domain }} {{ item.key }} {{ item.type }} {{ item.value }}"
  loop:
    # Finder設定
    - { domain: "com.apple.finder", key: "AppleShowAllFiles", type: "-bool", value: "true" }
    - { domain: "NSGlobalDomain", key: "AppleShowAllExtensions", type: "-bool", value: "true" }
    - { domain: "com.apple.finder", key: "ShowPathbar", type: "-bool", value: "true" }
    - { domain: "com.apple.finder", key: "ShowStatusBar", type: "-bool", value: "true" }
    - { domain: "com.apple.finder", key: "_FXShowPosixPathInTitle", type: "-bool", value: "true" }
    - { domain: "com.apple.finder", key: "_FXSortFoldersFirst", type: "-bool", value: "true" }
    - { domain: "com.apple.finder", key: "NewWindowTarget", type: "-string", value: '"PfHm"' }
    # Dock設定
    - { domain: "com.apple.dock", key: "autohide", type: "-bool", value: "true" }
    - { domain: "com.apple.dock", key: "tilesize", type: "-int", value: "36" }
    - { domain: "com.apple.dock", key: "autohide-time-modifier", type: "-float", value: "0.5" }
    # キーボード設定
    - { domain: "NSGlobalDomain", key: "KeyRepeat", type: "-int", value: "2" }
    - { domain: "NSGlobalDomain", key: "InitialKeyRepeat", type: "-int", value: "15" }
    # トラックパッド設定
    - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "Clicking", type: "-bool", value: "true" }
    - { domain: "com.apple.AppleMultitouchTrackpad", key: "Clicking", type: "-bool", value: "true" }
    - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadThreeFingerDrag", type: "-bool", value: "true" }
    - { domain: "com.apple.AppleMultitouchTrackpad", key: "TrackpadThreeFingerDrag", type: "-bool", value: "true" }
    - { domain: "NSGlobalDomain", key: "com.apple.swipescrolldirection", type: "-bool", value: "true" }
    # セキュリティ設定
    - { domain: "com.apple.LaunchServices", key: "LSQuarantine", type: "-bool", value: "false" }
    # メニューバー設定
    - { domain: "com.apple.menuextra.clock", key: "IsAnalog", type: "-bool", value: "true" }
    - { domain: "com.apple.menuextra.battery", key: "ShowPercent", type: "-bool", value: "false" }
    # .DS_Storeファイル
    - { domain: "com.apple.desktopservices", key: "DSDontWriteNetworkStores", type: "-bool", value: "true" }
  loop_control:
    label: "{{ item.domain }}: {{ item.key }}"
  changed_when: true
  notify:
    - restart_finder
    - restart_dock
    - restart_systemuiserver

- name: トラックパッドのタップでクリックを有効化（currentHost）
  ansible.builtin.command: "defaults -currentHost write -g com.apple.mouse.tapBehavior -int 1"
  changed_when: true

- name: Finderを再起動
  ansible.builtin.command: killall Finder
  changed_when: false
  failed_when: false

- name: Dockを再起動
  ansible.builtin.command: killall Dock
  changed_when: false
  failed_when: false

- name: SystemUIServerを再起動
  ansible.builtin.command: killall SystemUIServer
  changed_when: false
  failed_when: false

- name: cfprefsdを再起動
  ansible.builtin.command: killall cfprefsd
  changed_when: false
  failed_when: false
  ignore_errors: true
