---
- name: macOSシステム設定の現在値を確認
  ansible.builtin.command:
    argv:
      - defaults
      - read
      - "{{ item.domain }}"
      - "{{ item.key }}"
  loop: "{{ macos_defaults_settings }}"
  loop_control:
    label: "{{ item.domain }}: {{ item.key }}"
  register: macos_defaults_current
  changed_when: false
  failed_when: false
  vars:
    macos_defaults_settings:
      # Finder設定
      - { domain: "com.apple.finder", key: "AppleShowAllFiles", type: "-bool", value: "true", expected: "1" }
      - { domain: "NSGlobalDomain", key: "AppleShowAllExtensions", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.finder", key: "ShowPathbar", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.finder", key: "ShowStatusBar", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.finder", key: "_FXShowPosixPathInTitle", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.finder", key: "_FXSortFoldersFirst", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.finder", key: "NewWindowTarget", type: "-string", value: "PfHm", expected: "PfHm" }
      # Dock設定
      - { domain: "com.apple.dock", key: "autohide", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.dock", key: "tilesize", type: "-int", value: "36", expected: "36" }
      - { domain: "com.apple.dock", key: "autohide-time-modifier", type: "-float", value: "0.5", expected: "0.5" }
      # キーボード設定
      - { domain: "NSGlobalDomain", key: "KeyRepeat", type: "-int", value: "2", expected: "2" }
      - { domain: "NSGlobalDomain", key: "InitialKeyRepeat", type: "-int", value: "15", expected: "15" }
      # トラックパッド設定
      - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "Clicking", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.AppleMultitouchTrackpad", key: "Clicking", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadThreeFingerDrag", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.AppleMultitouchTrackpad", key: "TrackpadThreeFingerDrag", type: "-bool", value: "true", expected: "1" }
      - { domain: "NSGlobalDomain", key: "com.apple.swipescrolldirection", type: "-bool", value: "true", expected: "1" }
      # セキュリティ設定
      - { domain: "com.apple.LaunchServices", key: "LSQuarantine", type: "-bool", value: "false", expected: "0" }
      # メニューバー設定
      - { domain: "com.apple.menuextra.clock", key: "IsAnalog", type: "-bool", value: "true", expected: "1" }
      - { domain: "com.apple.menuextra.battery", key: "ShowPercent", type: "-bool", value: "false", expected: "0" }
      # .DS_Storeファイル
      - { domain: "com.apple.desktopservices", key: "DSDontWriteNetworkStores", type: "-bool", value: "true", expected: "1" }

- name: macOSシステム設定を適用
  ansible.builtin.command:
    argv:
      - defaults
      - write
      - "{{ item.item.domain }}"
      - "{{ item.item.key }}"
      - "{{ item.item.type }}"
      - "{{ item.item.value }}"
  loop: "{{ macos_defaults_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.domain }}: {{ item.item.key }}"
  when: item.rc != 0 or (item.stdout | trim) != item.item.expected
  changed_when: true
  notify: macOS設定変更後に関連サービスを再起動

- name: トラックパッドのタップでクリックの現在値を確認（currentHost）
  ansible.builtin.command:
    argv:
      - defaults
      - -currentHost
      - read
      - -g
      - com.apple.mouse.tapBehavior
  register: tap_behavior_current
  changed_when: false
  failed_when: false

- name: トラックパッドのタップでクリックを有効化（currentHost）
  ansible.builtin.command:
    argv:
      - defaults
      - -currentHost
      - write
      - -g
      - com.apple.mouse.tapBehavior
      - -int
      - "1"
  when: tap_behavior_current.rc != 0 or (tap_behavior_current.stdout | trim) != "1"
  changed_when: true
  notify: macOS設定変更後に関連サービスを再起動
