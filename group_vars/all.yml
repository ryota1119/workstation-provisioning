---
# Homebrewインストールパス
homebrew_prefix: /opt/homebrew
brew_bin: "{{ homebrew_prefix }}/bin/brew"
mas_bin: "{{ homebrew_prefix }}/bin/mas"
mise_bin: "{{ homebrew_prefix }}/bin/mise"

# Tapリポジトリ
brew_taps:
  - xdevplatform/tap

# Formulaパッケージ
brew_formula:
  # 開発ツール
  - awscli
  - chezmoi
  - git
  - gh
  - ghq
  - httpie
  - lazygit
  - mas
  - mise
  - neovim
  - ollama
  - tig
  - tree-sitter-cli

  # シェル
  - zsh
  - zsh-autosuggestions
  - zsh-completions

  # CLI ユーティリティ
  - bat
  - colordiff
  - coreutils
  - curl
  - direnv
  - eza
  - fd
  - ffmpeg
  - fzf
  - jq
  - ripgrep
  - telnet
  - tree
  - unar
  - usage
  - webp
  - wget

  # mise経由でPythonをビルドする際に必要
  - bzip2
  - libffi
  - readline
  - sqlite
  - tcl-tk
  - xz
  - zlib

  # mise経由でPHPをビルドする際に必要
  - autoconf
  - automake
  - bison
  - freetype
  - gd
  - gettext
  - icu4c@78
  - jpeg
  - krb5
  - libedit
  - libiconv
  - libpng
  - libyaml
  - libxml2
  - libzip
  - openssl@3
  - pkgconf
  - re2c

# Caskアプリケーション（通常）
brew_casks_normal:
  - 1password
  - 1password-cli
  - alfred
  - alt-tab
  - claude
  - claude-code@latest
  - cmux
  - codex
  - codexbar
  - chatgpt
  - firefox
  - figma
  - font-fira-code-nerd-font
  - font-hack-nerd-font
  - font-hackgen-nerd
  - gcloud-cli
  - ghostty
  - google-chrome
  - google-gemini
  - keka
  - kekaexternalhelper
  - monitorcontrol
  - notion
  - obsidian
  - postman
  - rectangle
  - setapp
  - slack
  - xdevplatform/tap/xurl

# Caskアプリケーション（sudo必要）
brew_casks_sudo_required:
  - cursor
  - docker-desktop
  - google-drive
  - keyboardcleantool
  - logi-options+
  - zoom

# Mac App Storeアプリ
mas_apps:
  - { name: "1Password for Safari", id: 1569813296 }
  - { name: "Toggl Track", id: 1291898086 }
  - { name: "Velja", id: 1607635845 }
  - { name: "LINE", id: 539883307 }

# miseツールバージョン
mise_tools_versions:
  - { name: "go", version: "1.26.5" }
  - { name: "mysql", version: "8.0.34" }
  - { name: "node", version: "24.18.0" }
  - { name: "php", version: "8.5.8" }
  - { name: "pnpm", version: "11.13.1" }
  - { name: "python", version: "3.14.6" }
  - { name: "uv", version: "0.11.29" }
  - { name: "ruby", version: "4.0.6" }
  - { name: "terraform", version: "1.15.8" }
  - { name: "terragrunt", version: "1.1.1" }
  - { name: "yarn", version: "1.22.22" }

# Mac App Store アプリのインストール（true: 有効 / false: 無効）
# host_vars/{ホスト名}.yml で上書き可能
enable_mas: true

# chezmoiのgit identity設定（1Password参照先）。デフォルトは個人用。
# 会社PC等で別の保管庫を参照する場合は、host_vars/{ホスト名}/chezmoi.local.yml
# （gitignore対象・chezmoi.local.yml.exampleを参考に作成）で上書きする。
# 1Passwordは複数アカウント同時サインインをしない運用のため、account指定は持たない
# （op readはそのマシンでサインインしている唯一のアカウントを自動的に使う）。
chezmoi_git_identity:
  onepassword_username_path: "op://Personal/GitHub - ryota1119/username"
  onepassword_email_path: "op://Personal/GitHub - ryota1119/email"
  onepassword_signing_key_path: "op://Personal/id_ed25519/public_key"

# workspace-base（~/Workspaceの基盤リポジトリ）のclone先・URL
workspace_base_repo_url: "git@github.com:ryota1119/workspace-base.git"
workspace_dest: "{{ ansible_env.HOME }}/Workspace"

# make upgradeの定期実行（launchd）
# true: LaunchAgentを配置して登録 / false: 登録解除してplistを削除
# host_vars/{ホスト名}.yml で上書き可能
enable_launchd_upgrade: true

launchd_agents_dir: "{{ ansible_env.HOME }}/Library/LaunchAgents"
launchd_upgrade_label: "com.{{ ansible_user_id }}.workstation-upgrade"
launchd_upgrade_plist: "{{ launchd_agents_dir }}/{{ launchd_upgrade_label }}.plist"
launchd_upgrade_script: "{{ playbook_dir }}/scripts/upgrade-scheduled.sh"
launchd_upgrade_log: "{{ playbook_dir }}/logs/launchd-upgrade.log"

# 実行時刻（24時間表記）。要素を増やせば1日に何回でも実行できる。
# 混雑を避けるため0分・30分は使わない。
launchd_upgrade_schedule:
  - hour: 10
    minute: 7
  - hour: 17
    minute: 7
