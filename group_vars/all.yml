---
# Homebrewインストールパス
homebrew_prefix: /opt/homebrew
brew_bin: "{{ homebrew_prefix }}/bin/brew"
mas_bin: "{{ homebrew_prefix }}/bin/mas"
mise_bin: "{{ homebrew_prefix }}/bin/mise"

# Tapリポジトリ
brew_taps:
  - ray-on-code/tap
  - xdevplatform/tap

# Formulaパッケージ
brew_formula:
  # 開発ツール
  - awscli
  - chezmoi
  - git
  - gh
  - ghq
  - hermes-agent
  - ray-on-code/tap/ghs
  - httpie
  - lazygit
  - mas
  - mise
  - neovim
  - tig
  - tmux

  # シェル
  - zsh
  - zsh-autosuggestions
  - zsh-completions

  # CLI ユーティリティ
  - bat
  - colordiff
  - coreutils
  - curl
  - direnv
  - eza
  - fd
  - ffmpeg
  - fzf
  - jq
  - ripgrep
  - telnet
  - tree
  - unar
  - usage
  - webp
  - wget

  # mise経由でPythonをビルドする際に必要
  - bzip2
  - libffi
  - readline
  - sqlite
  - tcl-tk
  - xz
  - zlib

  # mise経由でPHPをビルドする際に必要
  - autoconf
  - automake
  - bison
  - freetype
  - gd
  - gettext
  - icu4c@78
  - jpeg
  - krb5
  - libedit
  - libiconv
  - libpng
  - libyaml
  - libxml2
  - libzip
  - openssl@3
  - pkgconf
  - re2c

# Caskアプリケーション（通常）
brew_casks_normal:
  - 1password
  - 1password-cli
  - alfred
  - alt-tab
  - bettertouchtool
  - claude
  - claude-code
  - codex
  - codex-app
  - chatgpt
  - firefox
  - figma
  - font-fira-code-nerd-font
  - font-hack-nerd-font
  - gcloud-cli
  - ghostty
  - google-chrome
  - google-gemini
  - keka
  - kekaexternalhelper
  - monitorcontrol
  - notion
  - obsidian
  - postman
  - rectangle
  - setapp
  - superset
  - xdevplatform/tap/xurl

# Caskアプリケーション（sudo必要）
brew_casks_sudo_required:
  - cursor
  - docker-desktop
  - google-drive
  - keyboardcleantool
  - logi-options+
  - zoom

# Mac App Storeアプリ
mas_apps:
  - { name: "1Password for Safari", id: 1569813296 }
  - { name: "Toggl Track", id: 1291898086 }
  - { name: "Velja", id: 1607635845 }
  - { name: "LINE", id: 539883307 }

# miseツールバージョン
mise_tools_versions:
  - { name: "go", version: "1.26.5" }
  - { name: "mysql", version: "8.0.34" }
  - { name: "node", version: "24.18.0" }
  - { name: "php", version: "8.5.8" }
  - { name: "pnpm", version: "11.13.1" }
  - { name: "python", version: "3.14.6" }
  - { name: "uv", version: "0.11.29" }
  - { name: "ruby", version: "4.0.6" }
  - { name: "terraform", version: "1.15.8" }
  - { name: "terragrunt", version: "1.1.1" }
  - { name: "yarn", version: "1.22.22" }

# Mac App Store アプリのインストール（true: 有効 / false: 無効）
# host_vars/{ホスト名}.yml で上書き可能
enable_mas: true
