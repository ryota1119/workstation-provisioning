  - homebrew/cask-fonts

########################################################
# homebrew formula packages
########################################################
brew_formula:
  - 1password-cli
  - act
  - asdf
  - lazygit
  - tig
  - aws-elasticbeanstalk
  - awscli
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-completions
  - fish
  - tmux
  - direnv
  - ripgrep
  - fd
  - fzf
  - tree
  - age
  - colordiff
  - coreutils
  - curl
  - wget
  - jq
  - nkf
  - telnet
  - unar
  - mas
  - httpie
  - openapi-generator
  - ghq
  - gh
