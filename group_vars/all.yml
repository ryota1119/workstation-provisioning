########################################################
# homebrew cask upgrade settings
########################################################
# --greedyオプションの使用（自動更新機能を持つアプリも含めてアップグレード）
# true: Google Chrome, VSCodeなど自動更新アプリも含める（推奨）
# false: 自動更新機能を持つアプリは除外
cask_upgrade_greedy: true

########################################################
# homebrew cask packages
########################################################
# 通常のCask: 自動アップグレード対象
# sudo必要なCask: 初回インストールのみ自動、アップグレードは手動
brew_casks_normal:
  - alfred
  - alt-tab
  - arc
  - chatgpt
  - firefox
  - gcloud-cli
  - google-chrome
  - iterm2
  - monitorcontrol
  - notion
  - postman
  - slack
  - thebrowsercompany-dia
  - vrew
  - cursor
  - chatgpt-atlas
  - jordanbaird-ice

brew_casks_sudo_required:
  - docker-desktop
  - zoom
  - keyboardcleantool
  - logi-options+

########################################################
# mas packages
########################################################
mas_apps:
  - { name: "EasyRes", id: 688211836 }
  - { name: "Toggl Track", id: 1291898086 }
  - { name: "Velja", id: 1607635845 }
  - { name: "LINE", id: 539883307 }

########################################################
# asdf packages
########################################################
asdf_plugins:
  - golang
  - mysql
  - nodejs
  - php
  - pnpm
  - python
  - ruby
  - terraform
  - terragrunt
  - yarn

asdf_plugins_versions:
  - { name: "golang", version: "latest" }
  - { name: "mysql", version: "latest" }
  - { name: "nodejs", version: "latest" }
  - { name: "php", version: "latest" }
  - { name: "pnpm", version: "latest" }
  - { name: "python", version: "latest" }
  - { name: "ruby", version: "latest" }
  - { name: "terraform", version: "latest" }
  - { name: "terragrunt", version: "latest" }
  - { name: "yarn", version: "latest" }
