---
# Homebrewインストールパス
homebrew_prefix: /opt/homebrew

# Tapリポジトリ
brew_taps: []

# Formulaパッケージ
brew_formula:
  - act
  - awsdac
  - mise
  - lazygit
  - tig
  - aws-elasticbeanstalk
  - awscli
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-completions
  - tmux
  - direnv
  - ripgrep
  - fd
  - fzf
  - tree
  - age
  - colordiff
  - coreutils
  - curl
  - wget
  - jq
  - nkf
  - telnet
  - unar
  - mas
  - httpie
  - openapi-generator
  - ghq
  - gh
  - eza
  # 依存パッケージ
  - zlib
  - openssl@3
  # mise経由でPythonをビルドする際に必要
  - bzip2
  - libffi
  - readline
  - sqlite3
  - tcl-tk
  - xz
  # mise経由でyarnをビルドする際に必要
  - gpg
  # mise経由でPHPをビルドする際に必要
  - autoconf
  - automake
  - bison
  - freetype
  - gd
  - gettext
  - icu4c
  - krb5
  - libedit
  - libiconv
  - libjpeg
  - libpng
  - libxml2
  - libzip
  - openssl@1.1
  - pkg-config
  - re2c

# Caskアプリケーション（通常）
brew_casks_normal:
  - 1password-cli
  - alfred
  - alt-tab
  - cursor
  - figma
  - firefox
  - font-fira-code-nerd-font
  - font-hack-nerd-font
  - gcloud-cli
  - google-chrome
  - jordanbaird-ice@beta
  - iterm2
  - monitorcontrol
  - notion
  - postman
  - rectangle
  - setapp
  - slack

# Caskアプリケーション（sudo必要）
brew_casks_sudo_required:
  - docker-desktop
  - google-drive
  - keyboardcleantool
  - nordvpn
  - zoom

# Mac App Storeアプリ
mas_apps:
  - { name: "1Password for Safari", id: 1569813296 }
  - { name: "Toggl Track", id: 1291898086 }
  - { name: "Velja", id: 1607635845 }
  - { name: "LINE", id: 539883307 }

# miseツールバージョン
mise_tools_versions:
  - { name: "go", version: "latest" }
  - { name: "mysql", version: "latest" }
  - { name: "node", version: "latest" }
  - { name: "php", version: "latest" }
  - { name: "pnpm", version: "latest" }
  - { name: "python", version: "latest" }
  - { name: "uv", version: "latest" }
  - { name: "ruby", version: "latest" }
  - { name: "terraform", version: "latest" }
  - { name: "terragrunt", version: "latest" }
  - { name: "yarn", version: "latest" }

# dotfilesリポジトリのURL
chezmoi_repo_url: "git@github.com:ryota1119/dotfiles.git"
