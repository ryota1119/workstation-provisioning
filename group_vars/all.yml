########################################################
# homebrew tap packages
########################################################
# 注意: homebrew/cask-fontsは非推奨のため削除
# フォントはbrew_casks_normalで直接インストール可能
brew_taps: []

########################################################
# homebrew formula packages
########################################################
brew_base_formula:

brew_formula:
  - act
  - asdf
  - lazygit
  - tig
  - aws-elasticbeanstalk
  - awscli
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-completions
  - tmux
  - direnv
  - ripgrep
  - fd
  - fzf
  - tree
  - age
  - colordiff
  - coreutils
  - curl
  - wget
  - jq
  - nkf
  - telnet
  - unar
  - mas
  - httpie
  - openapi-generator
  - ghq
  - gh
  # asdf経由でPythonをビルドする際に必要な依存パッケージ
  - eza
  - bzip2
  - libffi
  - openssl
  - readline
  - sqlite3
  - tcl-tk
  - xz
  - zlib
  # asdf経由でyarnをビルドする際に必要な依存パッケージ
  - gpg

########################################################
# homebrew cask packages
########################################################
# 通常のCask: 自動アップグレード対象
# sudo必要なCask: 初回インストールのみ自動、アップグレードは手動
brew_casks_normal:
  - 1password-cli
  - alfred
  - alt-tab
  - chatgpt
  - cursor
  - firefox
  - font-fira-code-nerd-font
  - font-hack-nerd-font
  - gcloud-cli
  - google-chrome
  - jordanbaird-ice@beta
  - iterm2
  - monitorcontrol
  - notion
  - postman
  - rectangle
  - setapp
  - slack

brew_casks_sudo_required:
  - docker-desktop
  - google-drive
  - keyboardcleantool
  - nordvpn
  - zoom

########################################################
# mas packages
########################################################
mas_apps:
  - { name: "1Password for Safari", id: 1569813296 }
  - { name: "Toggl Track", id: 1291898086 }
  - { name: "Velja", id: 1607635845 }
  - { name: "LINE", id: 539883307 }

########################################################
# asdf packages
########################################################
asdf_plugins:
  - golang
  - mysql
  - nodejs
  - php
  - pnpm
  - python
  - ruby
  - terraform
  - terragrunt
  - yarn

asdf_plugins_versions:
  - { name: "golang", version: "latest" }
  - { name: "mysql", version: "latest" }
  - { name: "nodejs", version: "latest" }
  - { name: "php", version: "latest" }
  - { name: "pnpm", version: "latest" }
  - { name: "python", version: "latest" }
  - { name: "ruby", version: "latest" }
  - { name: "terraform", version: "latest" }
  - { name: "terragrunt", version: "latest" }
  - { name: "yarn", version: "latest" }

########################################################
# chezmoi packages
########################################################
# dotfilesリポジトリのURL
# HTTPSまたはSSH形式で指定可能
# 例: https://github.com/username/dotfiles.git
# 例: git@github.com:username/dotfiles.git
chezmoi_repo_url: "git@github.com:ryota1119/dotfiles.git"
