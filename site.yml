---
########################################################
# メインプレイブック
########################################################
- name: メインプレイブック
  hosts: localhost
  gather_facts: true
  become: false

  ########################################################
  # 各ロールの実行
  ########################################################
  roles:
    ########################################################
    # macOS専用role
    ########################################################
    - role: homebrew
      when: ansible_os_family == 'Darwin'
      tags: [macos, packages, homebrew]

    - role: mas
      when: ansible_os_family == 'Darwin'
      tags: [macos, apps, mas]

    - role: mac-setup
      when: ansible_os_family == 'Darwin'
      tags: [macos, setup, defaults]

    ########################################################
    # OS共通role
    ########################################################
    - role: asdf
      tags: [common, languages, asdf]

    ########################################################
    # dotfiles管理（1Password認証が必要）
    ########################################################
    - role: chezmoi
      tags: [common, dotfiles, chezmoi]
