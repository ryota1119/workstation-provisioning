---
- name: 環境プロビジョニング
  hosts: local
  gather_facts: true
  become: false

  roles:
    # 1. Homebrew: 各種言語ランタイムのビルド依存ライブラリを最初に導入
    - role: homebrew
      when: ansible_os_family == 'Darwin'

    # 2. Mac App Store: 他ロールに依存しない
    - role: mas
      when: ansible_os_family == 'Darwin'

    # 3. mise: Homebrewのライブラリに依存する言語ランタイムを導入
    - role: mise
      when: ansible_os_family == 'Darwin'

    # 4. macOSシステム設定
    - role: mac-setting
      when: ansible_os_family == 'Darwin'

    # 5. chezmoi設定の事前生成(preseed): chezmoi init時の1Password対話プロンプトを回避する
    - role: chezmoi-config-bootstrap
      when: ansible_os_family == 'Darwin'

    # 6. workspace-base: ~/Workspaceの基盤リポジトリをclone/更新（他ロールに依存しない）
    - role: workspace-base

    # 7. workspace-repositories: ghq配下のMCPリポジトリをclone/更新して依存関係を同期
    - role: workspace-repositories
