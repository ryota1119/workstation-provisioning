---
- name: 環境プロビジョニング
  hosts: localhost
  gather_facts: true
  become: false

  roles:
    # OS共通ロール
    - role: mise

    # macOS専用ロール
    - role: homebrew
      when: ansible_os_family == 'Darwin'
    - role: mas
      when: ansible_os_family == 'Darwin'
    - role: mac-setting
      when: ansible_os_family == 'Darwin'

    # dotfiles管理
    - role: chezmoi
