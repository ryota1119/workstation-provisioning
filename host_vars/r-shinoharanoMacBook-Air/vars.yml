---
# r-shinoharanoMacBook-Air（仕事用マシン）固有の設定
# group_vars/all.yml の共通設定に追加・上書きする内容を記述します。

# Mac App Store アプリのインストールを無効化
enable_mas: false

# このマシンにだけ追加するFormulaパッケージ
brew_formula_extra: []

# このマシンにだけ追加するCaskアプリ
# sudoが必要なものも同じリストに入れる。実行時に検出して最後に手動実行を案内する。
brew_casks_extra:
  - microsoft-office
  - microsoft-teams
