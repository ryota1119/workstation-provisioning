---
# r-shinoharanoMacBook-Air（仕事用マシン）固有の設定
# group_vars/all.yml の共通設定に追加・上書きする内容を記述します。

# Mac App Store アプリのインストールを無効化
enable_mas: false

# このマシンにだけ追加するFormulaパッケージ
brew_formula_extra: []

# このマシンにだけ追加するCaskアプリ
brew_casks_normal_extra:
  - microsoft-teams
  - zen

# このマシンにだけ追加するCaskアプリ（sudo必要）
brew_casks_sudo_required_extra:
  - microsoft-office
