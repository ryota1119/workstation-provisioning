---
# Rays-MPPM5 マシン固有の設定
# group_vars/all.yml の共通設定に追加・上書きする内容を記述してください。

# このマシンにだけ追加するTapリポジトリ
brew_taps_extra:
  - anomalyco/tap

# このマシンにだけ追加するFormulaパッケージ
brew_formula_extra:
  - anomalyco/tap/opencode

# このマシンにだけ追加するCaskアプリ
# sudoが必要なものも同じリストに入れる。実行時に検出して最後に手動実行を案内する。
brew_casks_extra:
  - nordvpn
  - slack

